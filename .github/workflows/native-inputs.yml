name: Native inputs
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    container: node:24.20.0-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install baseline compiler prerequisites
        run: apt-get update && apt-get install -y build-essential python3 pkg-config libsecret-1-dev
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and probe Linux inputs on the Debian bookworm baseline
        id: bundle
        run: setsid --wait npm run native:inputs -- build linux-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.directory }}
          retention-days: 30
          if-no-files-found: error
  darwin:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build macOS inputs on their target host
        id: bundle
        run: npm run native:inputs -- build darwin-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.directory }}
          retention-days: 30
          if-no-files-found: error
