name: Offline checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsecret-1-dev
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install checksum-pinned link checker
        run: npm run docs:install
      - name: Check repository links and headings offline
        run: npm run docs:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run deterministic tests, boundary checks, and CRAP quality gate
        run: npm run quality:check
      - name: Build distributable source
        run: npm run build
