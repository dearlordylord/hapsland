name: Offline checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-inputs:
    uses: ./.github/workflows/native-inputs.yml
  check:
    needs: native-inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsecret-1-dev
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Locate Darwin inputs for current sources
        id: native
        run: npm run native:inputs -- identity darwin-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.native.outputs.name }}
          path: .test-runs/downloaded-native
      - name: Import verified Darwin inputs
        run: npm run native:inputs -- import darwin-arm64 .test-runs/downloaded-native
      - name: Install checksum-pinned link checker
        run: npm run docs:install
      - name: Check repository links and headings offline
        run: npm run docs:check
      - name: Check tracked asset policy
        run: node scripts/check-repository-assets.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Run deterministic tests, boundary checks, and CRAP quality gate
        run: npm run quality:check -- --ack-checks-policy
      - name: Retain stage timings and complete failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-check-evidence
          include-hidden-files: true
          path: |
            .test-runs/**/manifest.json
            .test-runs/**/status.json
            .test-runs/**/results.json
            .test-runs/**/archive.json
            .test-runs/**/inputs-*.json
            .test-runs/**/stages/*.json
            .test-runs/**/failures.jsonl
            .test-runs/**/*.log
          if-no-files-found: ignore
          retention-days: 3
